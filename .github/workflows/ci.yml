name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["results/**", "README.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check health tests
      - run: ruff format --check health tests
      - run: pytest -q

name: nightly

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: plugin-health
  cancel-in-progress: false

jobs:
  check:
    name: check (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [latest, main]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Check every community plugin
        run: python -m health.run --target ${{ matrix.target }} --workers 8

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.target }}
          path: results/${{ matrix.target }}*
          if-no-files-found: error

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: Rebuild README
        run: python -m health.report

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md results
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "results: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: File an issue for status changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=""
          for target in latest main; do
            f="results/${target}-changes.md"
            if [ -s "$f" ]; then
              body+=$'\n'"### pipecat ${target}"$'\n\n'"$(cat "$f")"$'\n'
            fi
          done
          if [ -n "$body" ]; then
            gh issue create --title "Plugin status changes $(date -u +%Y-%m-%d)" --body "$body"
          fi
